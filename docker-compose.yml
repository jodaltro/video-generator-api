version: '3.8'

services:
  video-generator-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MODELS_DIR=/workspace/models
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      # ⚠️ REQUIRED: HuggingFace token for gated models (Gemma 3)
      # Get token at: https://huggingface.co/settings/tokens
      # Request access: https://huggingface.co/google/gemma-3-12b-it
      - HF_TOKEN=${HF_TOKEN:-}  # Set in .env file or via: HF_TOKEN=hf_xxx docker-compose up
    volumes:
      # Persist workspace data (models, dependencies marker) across restarts
      - workspace-data:/workspace
      # Persist installed Python packages across restarts
      - pip-packages:/usr/local/lib/python3.10/dist-packages
      - pip-bin:/usr/local/bin
      # Persist LTX-2 clone across restarts
      - ltx2-repo:/opt/LTX-2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  workspace-data:
  pip-packages:
  pip-bin:
  ltx2-repo:
