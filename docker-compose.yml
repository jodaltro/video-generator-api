version: '3.8'

services:
  video-generator-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MODELS_DIR=/workspace/models
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    volumes:
      # Persist workspace data (models, dependencies marker) across restarts
      - workspace-data:/workspace
      # Persist installed Python packages across restarts
      - pip-packages:/usr/local/lib/python3.10/dist-packages
      - pip-bin:/usr/local/bin
      # Persist LTX-2 clone across restarts
      - ltx2-repo:/opt/LTX-2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  workspace-data:
  pip-packages:
  pip-bin:
  ltx2-repo:
