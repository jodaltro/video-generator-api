version: '3.8'

services:
  video-generator-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MODELS_DIR=/workspace/models
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    volumes:
      # Persist models across restarts
      - models-cache:/workspace/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  models-cache:
